<style><![CDATA[
 .spin,.spinR,.cyc,.glow,.check{transform-box:view-box;transform-origin:300px 300px;}
 .spin{animation:rot 26s linear infinite;} .spinR{animation:rot 22s linear infinite reverse;}
 .cyc{animation:rot 14s linear infinite;} @keyframes rot{to{transform:rotate(360deg);}}
 .glow{animation:glow 3.4s ease-in-out infinite;}
 @keyframes glow{0%,100%{opacity:.10;transform:scale(.96);}50%{opacity:.26;transform:scale(1.05);}}
 .check{transform-origin:303px 300px;animation:beat 3.4s ease-in-out infinite;}
 @keyframes beat{0%,100%{transform:scale(1);}50%{transform:scale(1.055);}}
 .flow{stroke-dasharray:2 6;animation:flow 1.1s linear infinite;}
 @keyframes flow{to{stroke-dashoffset:-8;}}
 .node{animation:float 6s ease-in-out infinite;}
 .n1{animation-delay:0s;} .n2{animation-delay:-1.5s;} .n3{animation-delay:-3s;} .n4{animation-delay:-4.5s;}
 @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
 .tw{animation:tw 3s ease-in-out infinite;} .da{animation-delay:-1s;} .db{animation-delay:-2s;}
 @keyframes tw{0%,100%{opacity:.3;}50%{opacity:.95;}}
 @media (prefers-reduced-motion:reduce){ .spin,.spinR,.cyc,.glow,.check,.flow,.node,.tw{animation:none!important;} }
]]></style>

