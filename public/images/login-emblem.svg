<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
<defs>

 <radialGradient id="cglow" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#3B82F6" stop-opacity=".5"/>
  <stop offset="45%" stop-color="#3B82F6" stop-opacity=".14"/>
  <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
 <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#38BDF8"/><stop offset="55%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient>
 <linearGradient id="discGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#123064"/><stop offset="100%" stop-color="#0A2350"/></linearGradient>
 <linearGradient id="cycle" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#38BDF8"/></linearGradient>
